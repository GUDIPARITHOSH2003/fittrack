    <path fill="url(#limeGrad)" d="M12 2c-.8 2.2-2 4.4-3.5 6.2C7 10 6 12 6 14.5 6 18.1 8.7 21 12 21s6-2.9 6-6.5c0-2.5-1-4.5-2.5-6.3C14 6.4 12.8 4.2 12 2zm0 16c-1.7 0-3-1.3-3-3 0-1.2.6-2.3 1.5-3.3.4-.4.9-.8 1.5-1.3.6.5 1.1.9 1.5 1.3.9 1 1.5 2.1 1.5 3.3 0 1.7-1.3 3-3 3z"/>
